# Netlify configuration for Next.js static export

[build]
  publish = "out"
  command = "npm run build"

# Redirect all routes to index.html for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Handle 404s
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
  conditions = {Role = ["admin"]}
